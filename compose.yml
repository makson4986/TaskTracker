services:
  postgres:
    image: postgres:15.17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME_BACKEND}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    networks:
      - task-tracker
  kafka-1:
    image: apache/kafka:4.1.2
    container_name: kafka-1
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - task-tracker
  kafka-2:
    image: apache/kafka:4.1.2
    container_name: kafka-2
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    networks:
      - task-tracker
  kafka-3:
    image: apache/kafka:4.1.2
    container_name: kafka-3
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    networks:
      - task-tracker
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks:
      - task-tracker
  kafka-init:
    image: apache/kafka:4.1.2
    container_name: kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    volumes:
      - ./init/kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks:
      - task-tracker
    restart: "no"
  nginx:
    image: nginx:1.29.8
    container_name: nginx 
    ports:
      - "80:80"
    depends_on:
      - task-tracker-backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - task-tracker
  task-tracker-backend:
    build: ./TaskTrackerBackend
    container_name: task-tracker-backend
    depends_on:
      postgres:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME_BACKEND: ${DB_NAME_BACKEND}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER_URL: ${KAFKA_BROKER_URL}
      KAFKA_GREETING_TOPIC: ${KAFKA_GREETING_TOPIC}
    networks:
      - task-tracker
  task-tracker-scheduler:
    build: ./TaskTrackerScheduler
    container_name: task-tracker-scheduler
    depends_on:
      postgres:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME_SCHEDULER: ${DB_NAME_SCHEDULER}
      KAFKA_BROKER_URL: ${KAFKA_BROKER_URL}
      KAFKA_SUMMARIZATION_REQUESTS_TOPIC: ${KAFKA_SUMMARIZATION_REQUESTS_TOPIC}
      KAFKA_SUMMARIZATION_RESPONSES_TOPIC: ${KAFKA_SUMMARIZATION_RESPONSES_TOPIC}
      KAFKA_REPORT_TOPIC: ${KAFKA_REPORT_TOPIC}
      TASK_BACKEND_URL: ${TASK_BACKEND_URL}
    networks:
      - task-tracker
  task-tracker-summarization:
    build: ./TaskTrackerSummarization
    container_name: task-tracker-summarization
    depends_on:
      postgres:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER_URL: ${KAFKA_BROKER_URL}
      KAFKA_SUMMARIZATION_REQUESTS_TOPIC: ${KAFKA_SUMMARIZATION_REQUESTS_TOPIC}
      LLM_MODEL: ${LLM_MODEL}
      LLM_AUTH_URL: ${LLM_AUTH_URL}
      LLM_API_URL: ${LLM_API_URL}
      LLM_AUTHORIZATION_KEY: ${LLM_AUTHORIZATION_KEY}
    networks:
      - task-tracker
  task-tracker-mail:
    build: ./TaskTrackerMail
    container_name: task-tracker-mail
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER_URL: ${KAFKA_BROKER_URL}
      KAFKA_REPORT_TOPIC: ${KAFKA_REPORT_TOPIC}
      KAFKA_GREETING_TOPIC: ${KAFKA_GREETING_TOPIC}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    networks:
      - task-tracker

networks:
  task-tracker:
    driver: bridge
volumes:
  postgres-data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data: