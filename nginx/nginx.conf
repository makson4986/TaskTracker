server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    location /api/tasks       { proxy_pass http://task-tracker-backend:8080; }
    location /api/user        { proxy_pass http://task-tracker-backend:8080; }
    location /api/auth        { proxy_pass http://task-tracker-backend:8080; }
    location /api/docs        { proxy_pass http://task-tracker-backend:8080; }
    location /api/swagger-ui  { proxy_pass http://task-tracker-backend:8080; }
    location /v3              { proxy_pass http://task-tracker-backend:8080; }
    location /openapi.yml     { proxy_pass http://task-tracker-backend:8080; }
    
    location / { 
        return 404; 
    }

}